# Servidor del sitio (reemplaza /etc/nginx/conf.d/default.conf de la imagen nginx:alpine).
# Ojo: no usar add_header aquí dentro; las cabeceras de seguridad vienen de security-headers.conf
# (nivel http) y nginx deja de heredarlas en cuanto un server/location define su propio add_header.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Archivos con huella (Vite): caché larga.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location /img/ {
        expires 30d;
        try_files $uri =404;
    }

    # Páginas de una maqueta anterior que nunca se publicaron (devolvían 404).
    location = /servicios.html  { return 302 /#productos; }
    location = /cotizacion.html { return 302 /#contacto; }
    location = /pedidos.html    { return 302 /#contacto; }
    location = /login.html      { return 302 /; }
    location = /register.html   { return 302 /; }

    location ~* \.vcf$ {
        default_type text/vcard;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
}
