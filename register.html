<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Registro | Ensilados Santa Cruz</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5bec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#162210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-300 antialiased h-screen flex overflow-hidden">

    <!-- Image Slider Left Side -->
    <div class="hidden lg:block lg:w-1/2 relative h-full overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-[10000ms] hover:scale-110 scale-105"
            data-aos="zoom-out" data-aos-duration="2000"
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCy7rLPewBTa6gkpggzPW7KE1XGzKvKhUot0a9aZmN_mKGR-bIDfVazqBydhjRcjvPo-zsau9Z3pJ8dYfLDsOfqkWskjZr_oss61VKojpnj_CsX-ezLSm3kkdnqLH_ljLrK_wi3oPoSrKo6K3ANfRcqmi04JMvCRj-OZHaC7kCebkBB9b-Ker1B9YVk-Kz0-IFwl813Dr4pEaLpkZQxwLZ5Ynw5N1rzxLSOniKxZw9coFj2sP-fnk0lRVinwYghLc1hEyRMXBRsRvk');">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-background-dark/90 via-background-dark/40 to-transparent">
        </div>
        <div class="absolute bottom-12 left-12 right-12 text-white" data-aos="fade-up" data-aos-delay="600"
            data-aos-duration="1000">
            <h3 class="text-4xl font-black mb-3 leading-tight">Únete a la nueva era del agro.</h3>
            <p class="text-lg opacity-80 border-l-4 border-primary pl-4">Calidad certificada y atención a tu medida
                desde el primer paso de registro.</p>
        </div>
    </div>

    <div
        class="flex-1 flex flex-col justify-center px-8 lg:px-24 relative z-10 h-full overflow-y-auto w-full lg:w-1/2 bg-white dark:bg-background-dark shadow-[-20px_0_40px_-20px_rgba(0,0,0,0.3)] z-50">
        <div class="absolute top-8 right-8 flex items-center gap-2 cursor-pointer z-50 hover:opacity-80 transition-opacity"
            onclick="window.location.href='index.html'" data-aos="fade-down">
            <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white uppercase">Santa
                Cruz</span>
            <div
                class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary text-background-dark shadow-md">
                <span class="material-symbols-outlined">agriculture</span>
            </div>
        </div>

        <div class="w-full max-w-md mx-auto pt-24 pb-12" data-aos="fade-left" data-aos-duration="1000">
            <div class="mb-10 text-center">
                <h2 class="text-4xl font-black mb-2 tracking-tight">Crear Cuenta</h2>
                <p class="text-slate-500 dark:text-slate-400">Comienza a experimentar un servicio de ensilados superior.
                </p>
            </div>

            <form class="space-y-4" id="register-form">
                <div class="space-y-2 group">
                    <label
                        class="text-sm font-bold text-slate-700 dark:text-slate-300 block transition-colors group-focus-within:text-primary">Nombre
                        Completo</label>
                    <div
                        class="relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all shadow-sm">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">person</span>
                        <input type="text" id="reg-name" required
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-white outline-none border-none"
                            placeholder="Juan Pérez">
                    </div>
                </div>

                <div class="space-y-2 group">
                    <label
                        class="text-sm font-bold text-slate-700 dark:text-slate-300 block transition-colors group-focus-within:text-primary">Correo
                        Electrónico</label>
                    <div
                        class="relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all shadow-sm">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">mail</span>
                        <input type="email" id="reg-email" required
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-white outline-none border-none"
                            placeholder="usuario@email.com">
                    </div>
                </div>

                <div class="space-y-2 group">
                    <label
                        class="text-sm font-bold text-slate-700 dark:text-slate-300 block transition-colors group-focus-within:text-primary">Contraseña</label>
                    <div
                        class="relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all shadow-sm">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
                        <input type="password" id="reg-pass" required
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-white outline-none border-none"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:-translate-y-1 transition-transform duration-300 mt-6 relative overflow-hidden group">
                    <span class="relative z-10 flex items-center justify-center gap-2">Registrarme <span
                            class="material-symbols-outlined group-hover:translate-x-1 transition-transform">how_to_reg</span></span>
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
                ¿Ya tienes una cuenta? <a href="login.html"
                    class="text-primary font-bold hover:underline transition-all">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 800 });
    </script>
    <script src="app.js"></script>
</body>

</html>
